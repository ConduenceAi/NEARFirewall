[workspace]
resolver = "2"
members = ["contracts/types", "contracts/registry", "contracts/account-policy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/ConduenceAi/NEARFirewall"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
nearfirewall-types = { path = "contracts/types" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
